<!doctype html>
<html lang="lo" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>ສະແກນເຊັກຊື່</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,'Noto Sans Lao','Noto Sans Thai',sans-serif;margin:0;min-height:100vh;background:linear-gradient(160deg,#fdfdff 0%,#eaf0fb 55%,#dbe8f9 100%) fixed;color:#222}
  .wrap{max-width:520px;margin:0 auto;padding:12px}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
  h2{margin:0 0 8px}
  label{display:block;font-weight:600;margin:10px 0 4px}
  input{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px}
  button{width:100%;margin-top:12px;padding:14px;font-size:17px;border:0;border-radius:10px;background:#1a73e8;color:#fff}
  button.sec{background:#e8eaed;color:#222}
  button.red{background:#d33}
  .err{color:#d33;margin-top:8px}
  .hidden{display:none !important}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
  .top b{font-size:16px}
  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:200px}
  #camMsg{font-size:13px;color:#777;margin-top:6px;word-break:break-word}
  #banner{margin:12px 0;padding:18px 12px;border-radius:14px;text-align:center;color:#fff;background:#888}
  #banner .big{font-size:30px;font-weight:700}
  #banner .name{font-size:22px;margin-top:4px}
  #banner .sub{font-size:15px;opacity:.95;margin-top:4px}
  .pend{background:#2a62c9 !important}.ok{background:#1e9e4a !important}.dup{background:#e08a00 !important}.bad{background:#d33 !important}.gray{background:#666 !important}
  #log .row{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:6px;color:#fff;font-size:15px;background:#888}
  #log .row.pending{background:#999}
  ul{margin:6px 0;padding-left:20px}
  .lv{background:#f4f6fb;border-radius:12px;padding:10px;margin-bottom:8px}
  .lv .n{font-weight:700}.lv .s{color:#444;font-size:14px;margin-top:2px}.lv .t{color:#777;font-size:12px;margin-top:2px}
  .lv .acts{display:flex;gap:8px;margin-top:8px}.lv .acts button{flex:1;margin:0;padding:10px;font-size:15px}
  .setup button.link{background:transparent;border:0;box-shadow:none;min-width:0;margin-top:10px;padding:6px;font-size:15px;color:#2a62c9;text-decoration:underline}

  /* ===== ໜ້າຕັ້ງຄ່າ (ແບບ glass + ວົງມົນສີຟ້າ) ===== */
  .setup{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:36px 20px 28px}
  .setup::before{content:"";position:fixed;left:-110px;bottom:-110px;width:300px;height:300px;border-radius:50%;background:linear-gradient(135deg,#3b7be8,#2a62c9);box-shadow:0 10px 30px rgba(42,98,201,.35);z-index:-1}
  .ttl{font-size:clamp(28px,8.5vw,44px);font-weight:800;text-align:center;margin:40px 0 28px;color:#000;text-shadow:0 4px 10px rgba(0,0,0,.18);line-height:1.25}
  .setup .card{width:100%;max-width:420px;background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:36px;padding:34px 26px 30px;box-shadow:0 10px 40px rgba(60,90,160,.12)}
  .setup label{font-size:18px;font-weight:400;margin:14px 0 6px}
  .setup input{border:3px solid #000;border-radius:14px;background:rgba(255,255,255,.6);padding:12px}
  .setup button{display:block;width:auto;min-width:170px;margin:26px auto 0;padding:14px 30px;background:rgba(240,245,255,.92);color:#000;font-size:20px;border:1px solid #cfd8ea;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
  .setup .err{text-align:center}
  .note{margin-top:auto;padding-top:40px;text-align:center;font-size:16px;color:#000}
  .note u{display:inline-block;margin-bottom:6px}
</style>
</head>
<body>

<div id="setup" class="wrap setup">
  <h1 class="ttl">ລະບົບສະແກນເຂົ້າຮຽນ</h1>
  <div class="card">
    <label>ID</label>
    <input id="code" inputmode="numeric" autocomplete="username" placeholder="ລະຫັດຂອງທ່ານ">
    <label>ລະຫັດຜ່ານ</label>
    <input id="pass" type="password" inputmode="numeric" autocomplete="current-password" placeholder="ລະຫັດຜ່ານສ່ວນຕົວ">
    <button id="start">ເລີ່ມສະແກນ</button>
    <button id="forget" class="link" type="button">ລ້າງຂໍ້ມູນທີ່ຈື່ໄວ້</button>
    <div id="msg" class="err"></div>
  </div>
  <div class="note"><u>ໝາຍເຫດ</u><br>ລະບົບສະແກນນີ້ໃຊ້ໄດ້ສະເພາະຄະນະຫ້ອງເທົ່ານັ້ນ</div>
</div>

<div id="scan" class="wrap hidden">
  <div class="card top">
    <div><div id="period"><b>ກຳລັງໂຫຼດ...</b></div><div>ເຊັກຊື່ແລ້ວ <b id="count">0</b> ຄົນ (ຮອບນີ້)</div></div>
  </div>
  <div id="reader"></div>
  <button class="sec" id="flip" style="margin-top:8px">🔄 ສະຫຼັບກ້ອງ</button>
  <div id="camMsg"></div>
  <div id="banner"><div class="big">ພ້ອມສະແກນ</div><div class="sub">ສະແກນໄດ້ເທື່ອລະຄົນ</div></div>
  <div class="card">
    <button class="sec" id="sumBtn" style="margin-top:0">ເບິ່ງສະຫຼຸບຄົນຂາດຊົ່ວໂມງນີ້</button>
    <div id="sum" class="hidden" style="margin-top:10px"></div>
    <button class="sec" id="leaveBtn">ຄຳຂໍລາ</button>
    <div id="leaveBox" class="hidden" style="margin-top:10px"></div>
    <button class="red" id="stop">ຢຸດສະແກນ</button>
  </div>
  <div id="log"></div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
function load(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

// <<< ວາງລິ້ງ Apps Script (/exec) ຂອງທ່ານຢູ່ບ່ອນນີ້ ບ່ອນດຽວ ແລ້ວນັກຮຽນ/ຫົວໜ້າບໍ່ຕ້ອງໃສ່ລິ້ງອີກ
var API_URL = 'https://script.google.com/macros/s/AKfycbyzNU6LE5y_EvAE742CITsHJPuYEYCPZKedQpX1V7q5LodGthuVbd0T14f0BnDXXIBHhg/exec';

$('code').value = load('lcode');
$('pass').value = load('lpass');

var token = '', roster = {}, rosterOk = false, leaveTimer = null;
var scanner = null, count = 0, seen = {}, wake = null, ac = null;
var cams = [], camId = load('camId'), facing = 'environment', flipping = false, launchId = 0;

function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

// ---- ເອີ້ນ API ----
function call(params){
  var u = new URL(API_URL);
  Object.keys(params).forEach(function(k){ u.searchParams.set(k, params[k]); });
  return fetch(u.toString()).then(function(r){ return r.json(); });
}

function doLogin(code, pass){
  return call({ api: 'leaderLogin', code: code, pass: pass }).then(function(r){
    if (r.status === 'ok'){
      token = r.token;
      roster = {}; (r.roster || []).forEach(function(x){ roster[x[0]] = x[1]; });
      rosterOk = (r.roster || []).length > 0;
      save('lcode', code); save('lpass', pass);
    }
    return r;
  });
}

// ເອີ້ນ API ພ້ອມ token ຖ້າ token ໝົດອາຍຸ ຈະລ໊ອກອິນຄືນເອງ 1 ຄັ້ງ
function api(params){
  var p = {}; Object.keys(params).forEach(function(k){ p[k] = params[k]; });
  p.token = token;
  return call(p).then(function(r){
    if (r.status !== 'badtoken') return r;
    return doLogin(load('lcode'), load('lpass')).then(function(l){
      if (l.status !== 'ok') return { status: 'badtoken' };
      p.token = token;
      return call(p);
    });
  });
}

// ---- ສຽງ/ສັ່ນ ----
function beepInit(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function beep(freq, ms){
  try {
    var o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(ac.destination); o.start();
    setTimeout(function(){ o.stop(); }, ms);
  } catch(e){}
}
function vib(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }

// ---- ເລີ່ມ/ຢຸດ ----
$('start').onclick = function(){
  var code = $('code').value.trim(), pass = $('pass').value.trim();
  var msg = $('msg'); msg.textContent = '';
  if (API_URL.indexOf('/exec') < 0){ msg.textContent = 'ຍັງບໍ່ໄດ້ໃສ່ລິ້ງລະບົບໃນໄຟລ໌ (API_URL)'; return; }
  if (!code || !pass){ msg.textContent = 'ກະລຸນາຕື່ມລະຫັດ ແລະ ລະຫັດຜ່ານ'; return; }
  beepInit();
  msg.textContent = 'ກຳລັງກວດສອບ...';
  doLogin(code, pass).then(function(r){
    if (r.status === 'badlogin'){ msg.textContent = 'ລະຫັດ ຫຼື ລະຫັດຜ່ານບໍ່ຖືກຕ້ອງ (ສະເພາະຫົວໜ້າຫ້ອງ)'; return; }
    if (r.status === 'locked'){ msg.textContent = 'ໃສ່ຜິດຫຼາຍເກີນໄປ ລອງໃໝ່ອີກ 10 ນາທີ'; return; }
    if (r.status !== 'ok'){ msg.textContent = 'ເຊື່ອມຕໍ່ລະບົບບໍ່ສຳເລັດ ກວດລິ້ງ ແລະ ການ Deploy'; return; }
    msg.textContent = '';
    startCamera();
  }).catch(function(){ msg.textContent = 'ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກວດອິນເຕີເນັດ ແລະ ການ Deploy ແບບ "ທຸກຄົນ"'; });
};
$('forget').onclick = function(){
  save('lcode', ''); save('lpass', ''); $('code').value = ''; $('pass').value = ''; $('msg').textContent = 'ລ້າງແລ້ວ';
};

// ---- ກ້ອງ ----
function camNote(m){ $('camMsg').textContent = m || ''; }

function camIndex(){
  for (var k = 0; k < cams.length; k++) if (cams[k].id === camId) return k;
  return -1;
}

function updateFlipLabel(){
  var t = '🔄 ສະຫຼັບກ້ອງ';
  var i = camIndex();
  if (i >= 0) t += ' (' + (i + 1) + '/' + cams.length + ': ' + (cams[i].label || '') + ')';
  else if (!cams.length) t += ' (' + (facing === 'user' ? 'ກ້ອງໜ້າ' : 'ກ້ອງຫຼັງ') + ')';
  $('flip').textContent = t;
}

// ຂໍສິດກ້ອງກ່ອນ ເພື່ອໃຫ້ໄດ້ຊື່ກ້ອງທັງໝົດ ແລ້ວປິດທັນທີ
function listCams(){
  var md = navigator.mediaDevices;
  if (!md || !md.enumerateDevices) return Promise.resolve();
  return md.getUserMedia({ video: true })
    .then(function(st){ st.getTracks().forEach(function(t){ t.stop(); }); })
    .catch(function(){})
    .then(function(){ return sleep(400); })
    .then(function(){ return md.enumerateDevices(); })
    .then(function(devs){
      cams = devs.filter(function(d){ return d.kind === 'videoinput'; })
                 .map(function(d){ return { id: d.deviceId, label: d.label || '' }; });
    })
    .catch(function(){ cams = []; });
}

// ເລືອກກ້ອງຫຼັງຕົວຫຼັກ (ຫຼີກ ultra-wide) ໃຊ້ເມື່ອມີກ້ອງຫຼັງຫຼາຍກວ່າ 1 ຕົວ
function pickMain(list){
  var back = list.filter(function(c){ return /back|rear|environment/i.test(c.label); });
  if (back.length < 2) return null;
  var main = back.filter(function(c){ return !/ultra|wide|tele|macro|depth/i.test(c.label); });
  var pool = main.length ? main : back;
  var num = function(c){ var m = c.label.match(/camera\d*\s+(\d+)/i); return m ? parseInt(m[1], 10) : 99; };
  pool.sort(function(a, b){ return num(a) - num(b); });
  return pool[0];
}

function stopScanner(){
  var s = scanner; scanner = null;
  var p = Promise.resolve();
  if (s){ try { p = Promise.resolve(s.stop()); } catch(e){} }
  return Promise.race([p.catch(function(){}), sleep(2500)]).then(function(){
    try { var v = document.querySelector('#reader video'); if (v && v.srcObject) v.srcObject.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
    try { if (s) s.clear(); } catch(e){}
    $('reader').innerHTML = '';
    return sleep(400);
  });
}

function startCamera(){
  $('setup').classList.add('hidden');
  $('scan').classList.remove('hidden');
  $('period').innerHTML = '<b>ພ້ອມສະແກນ</b>';
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); } catch(e){}
  camNote('ກຳລັງເປີດກ້ອງ...');
  refreshLeaveBadge();
  clearInterval(leaveTimer); leaveTimer = setInterval(refreshLeaveBadge, 90000);
  listCams().then(function(){
    if (camIndex() < 0){
      var p = pickMain(cams);
      camId = p ? p.id : '';
      save('camId', camId);
    }
    launch();
  });
}

function launch(){
  var my = ++launchId, done = false;
  updateFlipLabel();
  var sc = new Html5Qrcode('reader', {
    formatsToSupport: [Html5QrcodeSupportedFormats.QR_CODE],       // ຫາສະເພາະ QR ໄວຂຶ້ນ
    useBarCodeDetectorIfSupported: true,                           // ໃຊ້ຕົວອ່ານຂອງມືຖື (ໄວກວ່າ) ຖ້າມີ
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    verbose: false
  });
  scanner = sc;

  var fail = function(err){
    if (done || my !== launchId) return;
    done = true;
    camNote('ເປີດກ້ອງບໍ່ໄດ້: ' + (err && err.message ? err.message : err));
    if (camId){
      // ຖ້າເປີດກ້ອງທີ່ເລືອກບໍ່ໄດ້ ໃຫ້ລອງໃໝ່ດ້ວຍຄ່າເລີ່ມຕົ້ນ
      camId = ''; save('camId', '');
      stopScanner().then(function(){ if (!$('scan').classList.contains('hidden')) launch(); });
    } else {
      stopCamera('ເປີດກ້ອງບໍ່ໄດ້ ກະລຸນາອະນຸຍາດການໃຊ້ກ້ອງແລ້ວລອງໃໝ່');
    }
  };
  setTimeout(function(){ fail('ໝົດເວລາ'); }, 7000);

  sc.start(
    camId ? camId : { facingMode: facing },
    { fps: 25, disableFlip: true, qrbox: function(w, h){ var s = Math.floor(Math.min(w, h) * 0.75); return { width: s, height: s }; } },
    onScan,
    function(){}
  ).then(function(){
    if (my !== launchId) return;
    done = true;
    camNote('');
    updateFlipLabel();
    // ຂໍພາບຄົມຂຶ້ນ + ໂຟກັດຕໍ່ເນື່ອງ ເພື່ອອ່ານ QR ໄວຂຶ້ນ (ບາງເຄື່ອງບໍ່ຮອງຮັບ ກໍຂ້າມໄປ)
    try {
      sc.applyVideoConstraints({ width: { ideal: 1280 }, height: { ideal: 720 }, advanced: [{ focusMode: 'continuous' }] }).catch(function(){});
    } catch(e){}
  }).catch(fail);
}

function stopCamera(message){
  launchId++;
  clearInterval(leaveTimer);
  try { if (wake) { wake.release(); wake = null; } } catch(e){}
  stopScanner().then(function(){
    $('scan').classList.add('hidden');
    $('setup').classList.remove('hidden');
    $('msg').textContent = message || '';
  });
}
$('stop').onclick = function(){ stopCamera(''); };

// ---- ສະຫຼັບກ້ອງ (ວົນໄປທຸກກ້ອງໃນເຄື່ອງ: ກ້ອງຫຼັກ, ultra-wide, ກ້ອງໜ້າ ...) ----
$('flip').onclick = function(){
  if (flipping) return;
  flipping = true;
  if (cams.length){
    camId = cams[(camIndex() + 1) % cams.length].id;
    save('camId', camId);
  } else {
    camId = '';
    facing = (facing === 'environment') ? 'user' : 'environment';
  }
  camNote('ກຳລັງສະຫຼັບກ້ອງ...');
  stopScanner().then(function(){ launch(); }).catch(function(){}).then(function(){
    setTimeout(function(){ flipping = false; }, 800);
  });
};

// ---- ສະແກນ ----
function extractCode(t){
  t = String(t).trim();
  var m = t.match(/[?&]code=([^&#]+)/);
  return m ? decodeURIComponent(m[1]) : t;
}

function onScan(text){
  var code = extractCode(text);
  if (!code) return;
  var now = Date.now();
  if (seen[code] && now - seen[code] < 8000) return; // ກັນສະແກນຊ້ຳຄົນເດີມ
  seen[code] = now;
  var name = roster[code];
  var row = addRow(code);
  if (rosterOk && !name){            // ບໍ່ມີໃນລາຍຊື່ ບອກທັນທີ ບໍ່ຕ້ອງລໍຖ້າ server
    setTimeout(function(){ delete seen[code]; }, 2500);
    finish(row, code, { status: 'unknown', code: code });
    return;
  }
  if (name){                         // ສະແດງຊື່ທັນທີ ຂະນະບັນທຶກ
    row.a.textContent = '… ' + name;
    banner('pend', 'ກຳລັງບັນທຶກ', name, '');
    beep(1200, 40); vib(30);
  }
  api({ api: 'checkin', code: code })
    .then(function(r){ finish(row, code, r); })
    .catch(function(){ finish(row, code, { status: 'error' }); });
}

function addRow(code){
  var d = document.createElement('div'); d.className = 'row pending';
  var a = document.createElement('span'); a.textContent = code + ' ...';
  var b = document.createElement('span');
  d.appendChild(a); d.appendChild(b);
  var log = $('log'); log.insertBefore(d, log.firstChild);
  while (log.children.length > 30) log.removeChild(log.lastChild);
  return { el: d, a: a, b: b };
}

function banner(cls, big, name, sub){
  var b = $('banner');
  b.className = cls;
  b.innerHTML = '';
  var x = document.createElement('div'); x.className = 'big'; x.textContent = big; b.appendChild(x);
  if (name){ var y = document.createElement('div'); y.className = 'name'; y.textContent = name; b.appendChild(y); }
  if (sub){ var z = document.createElement('div'); z.className = 'sub'; z.textContent = sub; b.appendChild(z); }
}

function finish(row, code, r){
  var t = new Date().toTimeString().slice(0, 5);
  row.b.textContent = t;
  if (r.subject){ $('period').innerHTML = ''; var bb = document.createElement('b'); bb.textContent = r.subject + '  ' + r.label; $('period').appendChild(bb); }

  if (r.status === 'ok'){
    count++; $('count').textContent = count;
    row.el.className = 'row ok'; row.a.textContent = '✓ ' + r.name;
    banner('ok', '✓ ມາຮຽນ', r.name, r.subject + '  ' + r.label);
    beep(880, 120); vib(80);
  } else if (r.status === 'dup'){
    row.el.className = 'row dup'; row.a.textContent = 'ສະແກນແລ້ວ ' + r.name;
    banner('dup', 'ສະແກນແລ້ວ', r.name, 'ຄາບນີ້ເຊັກຊື່ໄປແລ້ວ');
    beep(440, 200); vib([60, 60, 60]);
  } else if (r.status === 'unknown'){
    row.el.className = 'row bad'; row.a.textContent = 'ບໍ່ພົບລະຫັດ ' + code;
    banner('bad', 'ບໍ່ພົບລະຫັດ', code, '');
    beep(220, 300); vib(300);
  } else if (r.status === 'noclass'){
    delete seen[code];
    row.el.className = 'row gray'; row.a.textContent = 'ບໍ່ມີຄາບຮຽນ';
    $('period').innerHTML = '<b>ຕອນນີ້ບໍ່ມີຄາບຮຽນ</b>';
    banner('gray', 'ບໍ່ມີຄາບຮຽນ', '', 'ຕອນນີ້ບໍ່ແມ່ນເວລາຮຽນຕາມຕາຕະລາງ');
    beep(300, 200);
  } else if (r.status === 'badtoken'){
    stopCamera('ໝົດເວລາເຂົ້າລະບົບ ກະລຸນາເຂົ້າໃໝ່');
  } else {
    delete seen[code];
    row.el.className = 'row bad'; row.a.textContent = 'ຜິດພາດ ສະແກນໃໝ່ ' + code;
    banner('bad', 'ຜິດພາດ', 'ສະແກນໃໝ່ອີກຄັ້ງ', '');
    beep(220, 300);
  }
}

// ---- ສະຫຼຸບ ----
$('sumBtn').onclick = function(){
  var box = $('sum');
  box.classList.remove('hidden');
  box.textContent = 'ກຳລັງໂຫຼດ...';
  api({ api: 'summary', idx: -1 }).then(function(r){
    if (r.status !== 'ok'){ box.textContent = 'ໂຫຼດບໍ່ສຳເລັດ'; return; }
    if (!r.periods.length){ box.textContent = 'ມື້ນີ້ບໍ່ມີຄາບຮຽນ'; return; }
    box.innerHTML = '';
    var h = document.createElement('div');
    h.innerHTML = '<b></b><div></div>';
    h.firstChild.textContent = r.periods[r.idx];
    h.lastChild.textContent = 'ມາຮຽນ ' + r.here.length + ' ຄົນ / ຂາດຮຽນ ' + r.absent.length + ' ຄົນ';
    box.appendChild(h);
    var ul = document.createElement('ul');
    r.absent.forEach(function(s){ var li = document.createElement('li'); li.textContent = s[0] + ' – ' + s[1]; ul.appendChild(li); });
    if (r.absent.length) { var t = document.createElement('div'); t.textContent = 'ຂາດຮຽນ:'; box.appendChild(t); box.appendChild(ul); }
  }).catch(function(){ box.textContent = 'ໂຫຼດບໍ່ສຳເລັດ'; });
};

// ---- ຄຳຂໍລາ (ຫົວໜ້າຫ້ອງອະນຸມັດ) ----
var LAO_MONTHS = ['ມັງກອນ','ກຸມພາ','ມີນາ','ເມສາ','ພຶດສະພາ','ມິຖຸນາ','ກໍລະກົດ','ສິງຫາ','ກັນຍາ','ຕຸລາ','ພະຈິກ','ທັນວາ'];
function fmtD(s){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  return m ? (+m[3]) + ' ' + LAO_MONTHS[+m[2] - 1] + ' ' + m[1] : (s || '');
}
function leaveCount(n){ $('leaveBtn').textContent = 'ຄຳຂໍລາ' + (n ? ' (ລໍຖ້າ ' + n + ')' : ''); }

function loadLeave(){
  return api({ api: 'leaveList' }).then(function(r){
    if (r.status !== 'ok') return null;
    leaveCount(r.pending.length);
    return r;
  }).catch(function(){ return null; });
}
function refreshLeaveBadge(){ return loadLeave(); }

function mk(tag, cls, text){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function renderLeave(r){
  var box = $('leaveBox');
  box.innerHTML = '';
  if (!r){ box.textContent = 'ໂຫຼດບໍ່ສຳເລັດ'; return; }
  if (!r.pending.length){ box.textContent = 'ບໍ່ມີຄຳຂໍລາທີ່ລໍຖ້າ'; return; }
  r.pending.forEach(function(it){
    var card = mk('div', 'lv');
    card.appendChild(mk('div', 'n', it.name + ' (' + it.code + ')'));
    card.appendChild(mk('div', 's', it.type + ' · ' + fmtD(it.from) + (it.to !== it.from ? ' – ' + fmtD(it.to) : '') + ' · ກະທົບ ' + it.classes + ' ຄາບ'));
    card.appendChild(mk('div', 's', 'ເຫດຜົນ: ' + it.reason));
    card.appendChild(mk('div', 't', 'ສົ່ງເມື່ອ ' + it.at));
    var row = mk('div', 'acts');
    var ok = mk('button', '', '✓ ອະນຸມັດ'); ok.style.background = '#1e9e4a';
    var no = mk('button', '', '✕ ບໍ່ອະນຸມັດ'); no.style.background = '#d33';
    ok.onclick = function(){ decide(it, 'approved', ok, no); };
    no.onclick = function(){ decide(it, 'rejected', ok, no); };
    row.appendChild(ok); row.appendChild(no); card.appendChild(row);
    box.appendChild(card);
  });
}

function decide(it, decision, ok, no){
  var note = '';
  if (decision === 'rejected'){
    note = window.prompt('ເຫດຜົນທີ່ບໍ່ອະນຸມັດ (ບໍ່ໃສ່ກໍໄດ້)', '');
    if (note === null) return;
  } else if (!window.confirm('ອະນຸມັດຄຳຂໍລາຂອງ ' + it.name + ' ?')) return;
  ok.disabled = true; no.disabled = true;
  api({ api: 'leaveDecide', id: it.id, decision: decision, note: note }).then(function(r){
    if (r.status === 'badtoken'){ stopCamera('ໝົດເວລາເຂົ້າລະບົບ ກະລຸນາເຂົ້າໃໝ່'); return; }
    if (r.status !== 'ok' && r.status !== 'done') window.alert('ບັນທຶກບໍ່ສຳເລັດ ກະລຸນາລອງໃໝ່');
    return loadLeave().then(renderLeave);
  }).catch(function(){
    ok.disabled = false; no.disabled = false;
    window.alert('ເຊື່ອມຕໍ່ບໍ່ໄດ້ ກະລຸນາລອງໃໝ່');
  });
}

$('leaveBtn').onclick = function(){
  var box = $('leaveBox');
  if (!box.classList.contains('hidden')){ box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  box.textContent = 'ກຳລັງໂຫຼດ...';
  loadLeave().then(renderLeave);
};
</script>
