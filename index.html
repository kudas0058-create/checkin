<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สแกนเช็คชื่อ</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  *{box-sizing:border-box}
  body{font-family:system-ui,'Noto Sans Thai','Noto Sans Lao',sans-serif;margin:0;background:#f4f5f7;color:#222}
  .wrap{max-width:520px;margin:0 auto;padding:12px}
  .card{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px}
  h2{margin:0 0 8px}
  label{display:block;font-weight:600;margin:10px 0 4px}
  input{width:100%;padding:12px;font-size:16px;border:1px solid #ccc;border-radius:10px}
  button{width:100%;margin-top:12px;padding:14px;font-size:17px;border:0;border-radius:10px;background:#1a73e8;color:#fff}
  button.sec{background:#e8eaed;color:#222}
  button.red{background:#d33}
  .err{color:#d33;margin-top:8px}
  .hidden{display:none}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
  .top b{font-size:16px}
  #reader{width:100%;border-radius:14px;overflow:hidden;background:#000;min-height:200px}
  #banner{margin:12px 0;padding:18px 12px;border-radius:14px;text-align:center;color:#fff;background:#888}
  #banner .big{font-size:30px;font-weight:700}
  #banner .name{font-size:22px;margin-top:4px}
  #banner .sub{font-size:15px;opacity:.95;margin-top:4px}
  .ok{background:#1e9e4a !important}.dup{background:#e08a00 !important}.bad{background:#d33 !important}.gray{background:#666 !important}
  #log .row{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;margin-bottom:6px;color:#fff;font-size:15px;background:#888}
  #log .row.pending{background:#999}
  ul{margin:6px 0;padding-left:20px}
</style>
</head>
<body>

<div id="setup" class="wrap">
  <div class="card">
    <h2>สแกนเช็คชื่อ (ต่อเนื่อง)</h2>
    <label>ลิงก์เว็บแอป (ลงท้ายด้วย /exec)</label>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label>PIN หัวหน้าห้อง</label>
    <input id="pin" type="password" inputmode="numeric" placeholder="PIN">
    <button id="start">เริ่มสแกน</button>
    <div id="msg" class="err"></div>
  </div>
  <div class="card" style="font-size:14px;color:#555">ข้อมูลนี้จะถูกจำไว้ในมือถือเครื่องนี้เท่านั้น ครั้งต่อไปกดเริ่มสแกนได้เลย</div>
</div>

<div id="scan" class="wrap hidden">
  <div class="card top">
    <div><div id="period"><b>กำลังโหลด...</b></div><div>เช็คชื่อแล้ว <b id="count">0</b> คน (รอบนี้)</div></div>
  </div>
  <div id="reader"></div>
  <div id="banner"><div class="big">พร้อมสแกน</div><div class="sub">ส่อง QR ของนักเรียนได้ทีละคนเลย</div></div>
  <div class="card">
    <button class="sec" id="sumBtn" style="margin-top:0">ดูสรุปคาบนี้ (ใครขาด)</button>
    <div id="sum" class="hidden" style="margin-top:10px"></div>
    <button class="red" id="stop">หยุดสแกน</button>
  </div>
  <div id="log"></div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
function load(k){ try { return localStorage.getItem(k) || ''; } catch(e){ return ''; } }
function save(k, v){ try { localStorage.setItem(k, v); } catch(e){} }

$('url').value = load('url');
$('pin').value = load('pin');

var apiUrl = '', pin = '', scanner = null, count = 0, seen = {}, wake = null, ac = null;

// ---- เรียก API ----
function call(params){
  var u = new URL(apiUrl);
  Object.keys(params).forEach(function(k){ u.searchParams.set(k, params[k]); });
  return fetch(u.toString()).then(function(r){ return r.json(); });
}

// ---- เสียง/สั่น ----
function beepInit(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} }
function beep(freq, ms){
  try {
    var o = ac.createOscillator(), g = ac.createGain();
    o.frequency.value = freq; g.gain.value = 0.15;
    o.connect(g); g.connect(ac.destination); o.start();
    setTimeout(function(){ o.stop(); }, ms);
  } catch(e){}
}
function vib(p){ try { if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }

// ---- เริ่ม/หยุด ----
$('start').onclick = function(){
  apiUrl = $('url').value.trim(); pin = $('pin').value.trim();
  var msg = $('msg'); msg.textContent = '';
  if (!apiUrl || !pin){ msg.textContent = 'กรอกให้ครบทั้ง 2 ช่อง'; return; }
  if (apiUrl.indexOf('/exec') < 0){ msg.textContent = 'ลิงก์ต้องลงท้ายด้วย /exec'; return; }
  beepInit();
  msg.textContent = 'กำลังตรวจสอบ...';
  call({ api: 'summary', pin: pin, idx: -1 }).then(function(r){
    if (r.status === 'badpin'){ msg.textContent = 'PIN ไม่ถูกต้อง'; return; }
    if (r.status !== 'ok'){ msg.textContent = 'เชื่อมต่อระบบไม่สำเร็จ ตรวจลิงก์ /exec และการ Deploy'; return; }
    save('url', apiUrl); save('pin', pin);
    msg.textContent = '';
    startCamera();
  }).catch(function(){ msg.textContent = 'เชื่อมต่อไม่ได้ ตรวจลิงก์ /exec (ต้อง Deploy แบบ "ทุกคน")'; });
};

function startCamera(){
  $('setup').classList.add('hidden');
  $('scan').classList.remove('hidden');
  $('period').innerHTML = '<b>พร้อมสแกน</b>';
  try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(w){ wake = w; }).catch(function(){}); } catch(e){}
  scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: function(w, h){ var s = Math.floor(Math.min(w, h) * 0.7); return { width: s, height: s }; } },
    onScan,
    function(){}
  ).catch(function(){
    stopCamera('เปิดกล้องไม่ได้ กรุณาอนุญาตการใช้กล้องแล้วลองใหม่');
  });
}

function stopCamera(message){
  var done = function(){
    $('scan').classList.add('hidden');
    $('setup').classList.remove('hidden');
    $('msg').textContent = message || '';
  };
  try { if (wake) { wake.release(); wake = null; } } catch(e){}
  if (scanner){
    var s = scanner; scanner = null;
    s.stop().then(function(){ s.clear(); done(); }).catch(done);
  } else done();
}
$('stop').onclick = function(){ stopCamera(''); };

// ---- สแกน ----
function extractCode(t){
  t = String(t).trim();
  var m = t.match(/[?&]code=([^&#]+)/);
  return m ? decodeURIComponent(m[1]) : t;
}

function onScan(text){
  var code = extractCode(text);
  if (!code) return;
  var now = Date.now();
  if (seen[code] && now - seen[code] < 8000) return; // กันสแกนรัวซ้ำคนเดิม
  seen[code] = now;
  var row = addRow(code);
  call({ api: 'checkin', code: code, pin: pin })
    .then(function(r){ finish(row, code, r); })
    .catch(function(){ finish(row, code, { status: 'error' }); });
}

function addRow(code){
  var d = document.createElement('div'); d.className = 'row pending';
  var a = document.createElement('span'); a.textContent = code + ' ...';
  var b = document.createElement('span');
  d.appendChild(a); d.appendChild(b);
  var log = $('log'); log.insertBefore(d, log.firstChild);
  while (log.children.length > 30) log.removeChild(log.lastChild);
  return { el: d, a: a, b: b };
}

function banner(cls, big, name, sub){
  var b = $('banner');
  b.className = cls;
  b.innerHTML = '';
  var x = document.createElement('div'); x.className = 'big'; x.textContent = big; b.appendChild(x);
  if (name){ var y = document.createElement('div'); y.className = 'name'; y.textContent = name; b.appendChild(y); }
  if (sub){ var z = document.createElement('div'); z.className = 'sub'; z.textContent = sub; b.appendChild(z); }
}

function finish(row, code, r){
  var t = new Date().toTimeString().slice(0, 5);
  row.b.textContent = t;
  if (r.subject){ $('period').innerHTML = ''; var bb = document.createElement('b'); bb.textContent = r.subject + '  ' + r.label; $('period').appendChild(bb); }

  if (r.status === 'ok'){
    count++; $('count').textContent = count;
    row.el.className = 'row ok'; row.a.textContent = '✓ ' + r.name;
    banner('ok', '✓ มาเรียน', r.name, r.subject + '  ' + r.label);
    beep(880, 120); vib(80);
  } else if (r.status === 'dup'){
    row.el.className = 'row dup'; row.a.textContent = 'สแกนแล้ว ' + r.name;
    banner('dup', 'สแกนแล้ว', r.name, 'คาบนี้เช็คชื่อไปแล้ว');
    beep(440, 200); vib([60, 60, 60]);
  } else if (r.status === 'unknown'){
    row.el.className = 'row bad'; row.a.textContent = 'ไม่พบรหัส ' + code;
    banner('bad', 'ไม่พบรหัส', code, '');
    beep(220, 300); vib(300);
  } else if (r.status === 'noclass'){
    delete seen[code];
    row.el.className = 'row gray'; row.a.textContent = 'ไม่มีคาบเรียน';
    $('period').innerHTML = '<b>ตอนนี้ไม่มีคาบเรียน</b>';
    banner('gray', 'ไม่มีคาบเรียน', '', 'ตอนนี้ไม่ใช่เวลาเรียนตามตาราง');
    beep(300, 200);
  } else if (r.status === 'badpin'){
    stopCamera('PIN ไม่ถูกต้อง ใส่ใหม่อีกครั้ง');
  } else {
    delete seen[code];
    row.el.className = 'row bad'; row.a.textContent = 'ผิดพลาด สแกนใหม่ ' + code;
    banner('bad', 'ผิดพลาด', 'สแกนใหม่อีกครั้ง', '');
    beep(220, 300);
  }
}

// ---- สรุป ----
$('sumBtn').onclick = function(){
  var box = $('sum');
  box.classList.remove('hidden');
  box.textContent = 'กำลังโหลด...';
  call({ api: 'summary', pin: pin, idx: -1 }).then(function(r){
    if (r.status !== 'ok'){ box.textContent = 'โหลดไม่สำเร็จ'; return; }
    if (!r.periods.length){ box.textContent = 'วันนี้ไม่มีคาบเรียน'; return; }
    box.innerHTML = '';
    var h = document.createElement('div');
    h.innerHTML = '<b></b><div></div>';
    h.firstChild.textContent = r.periods[r.idx];
    h.lastChild.textContent = 'มาเรียน ' + r.here.length + ' คน / ขาดเรียน ' + r.absent.length + ' คน';
    box.appendChild(h);
    var ul = document.createElement('ul');
    r.absent.forEach(function(s){ var li = document.createElement('li'); li.textContent = s[0] + ' – ' + s[1]; ul.appendChild(li); });
    if (r.absent.length) { var t = document.createElement('div'); t.textContent = 'ขาดเรียน:'; box.appendChild(t); box.appendChild(ul); }
  }).catch(function(){ box.textContent = 'โหลดไม่สำเร็จ'; });
};
</script>
</body>
</html>
